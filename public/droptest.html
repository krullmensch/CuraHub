<!DOCTYPE html>
<html>
<head><title>Drop Test</title></head>
<body style="margin:50px;font-family:sans-serif;">
<h1>File Drop Test</h1>
<div id="zone" style="width:400px;height:300px;background:#eee;border:3px dashed #999;display:flex;align-items:center;justify-content:center;font-size:24px;">
  Drop a file here
</div>
<p id="log"></p>
<script>
var z = document.getElementById('zone');
var log = document.getElementById('log');
z.addEventListener('dragenter', function(e) {
  e.preventDefault();
  log.textContent += 'dragenter | ';
});
z.addEventListener('dragover', function(e) {
  e.preventDefault();
  z.style.background = '#cfc';
});
z.addEventListener('dragleave', function(e) {
  z.style.background = '#eee';
  log.textContent += 'dragleave | ';
});
z.addEventListener('drop', function(e) {
  e.preventDefault();
  z.style.background = '#ccf';
  var files = e.dataTransfer ? e.dataTransfer.files : null;
  z.textContent = files ? ('Dropped ' + files.length + ' file(s): ' + files[0].name) : 'null dataTransfer';
  log.textContent += 'DROP! | ';
});
// Also prevent default on document to stop navigation
document.addEventListener('dragover', function(e) { e.preventDefault(); });
document.addEventListener('drop', function(e) { e.preventDefault(); log.textContent += 'doc-drop | '; });
</script>
</body>
</html>
