name: Project website

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/wiki/**'
      - 'docs/deployment.md'
      - 'src/assets/fonts/**'
      - 'public/BG_Video_CuraHub-*'
      - '.github/workflows/site.yml'
      - 'deploy/**'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/wiki/**'
      - 'docs/deployment.md'
      - 'src/assets/fonts/**'
      - 'public/BG_Video_CuraHub-*'
      - '.github/workflows/site.yml'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
