# CuraHub — one compose file for fresh installs and updates.
# Fresh install: `docker compose up -d`, then open https://<domain>/setup (code: `docker compose logs app`).
# See docs/deployment.md.
#
# Everything that has to survive lives in ./data next to this file, so backing up the stack
# directory backs up CuraHub:
#   data/secrets  database passwords and JWT secret (written once by `init`)
#   data/uploads  uploaded images, videos, models, PDFs
#   data/backups  daily database dumps (service `backup`) — restore from these, not from data/db
#   data/db       MariaDB's live files (a copy taken while it runs is not consistent)
services:
  init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "/init-secrets.sh"]
    volumes:
      - ./data:/data
      - ./deploy/init-secrets.sh:/init-secrets.sh:ro

  db:
    image: mariadb:10.6
    restart: always
    environment:
      # Only the *_FILE variants: the mariadb entrypoint aborts when a variable and its _FILE are both set.
      # An already initialised datadir ignores these (existing installations keep their passwords).
      MARIADB_ROOT_PASSWORD_FILE: /run/curahub-secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/curahub-secrets/db_password
      MARIADB_DATABASE: curahub
      MARIADB_USER: curahub
      # Creates the healthcheck user on older datadirs and upgrades system tables after image updates.
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/db:/var/lib/mysql
      - ./data/secrets:/run/curahub-secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - curahub-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # SEC-08: Docker port publishing bypasses ufw. Loopback by default — Apache on the host proxies to it.
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_EXTERNAL_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      # Empty = read from /run/curahub-secrets (fresh install). Set in .env only for existing installations.
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-false}
      VIDEO_JOB_CONCURRENCY: ${VIDEO_JOB_CONCURRENCY:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-}
      DEPLOYED_COMMIT: ${DEPLOYED_COMMIT:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/server/uploads
      - ./data/secrets:/run/curahub-secrets:ro
      # Read-only: the system check reports the age of the newest dump.
      - ./data/backups:/backups:ro
    networks:
      - curahub-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  backup:
    image: mariadb:10.6
    restart: always
    # Dumps every database once a day into data/backups and keeps 14 days (deploy/db-backup.sh).
    entrypoint: ["bash", "/db-backup.sh"]
    volumes:
      - ./data/backups:/backups
      - ./data/secrets:/run/curahub-secrets:ro
      - ./deploy/db-backup.sh:/db-backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - curahub-network

networks:
  curahub-network:
    driver: bridge
